[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts"
version = "1.0.0"
description = "Check the receipts on your AI coding agent's claims"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
receipts = "receipts.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
